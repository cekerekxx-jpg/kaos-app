name: Build Flet APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # v3 yerine v4 yapıldı

      - name: Set up Python
        uses: actions/setup-python@v5 # v4 yerine v5 yapıldı (daha güncel)
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flet buildozer

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4 # v3 yerine v4 yapıldı
        with:
          name: app-debug
          path: bin/*.apk
